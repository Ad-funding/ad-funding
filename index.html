<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Funding Platform - تمويل الحملات الإعلانية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; line-height: 1.6; }
        header { background: #161b22; padding: 20px; text-align: center; border-bottom: 1px solid #30363d; }
        header h1 { color: #58a6ff; font-size: 24px; }
        .hero { text-align: center; padding: 80px 20px; }
        .hero h2 { font-size: 36px; color: #ffffff; margin-bottom: 15px; }
        .hero p { color: #8b949e; margin-bottom: 30px; font-size: 18px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .btn { background: #238636; color: white; padding: 14px 35px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; text-decoration: none; display: inline-block; font-weight: bold; }
        .btn:hover { background: #2ea043; }
        footer { text-align: center; padding: 20px; margin-top: 50px; border-top: 1px solid #30363d; color: #8b949e; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>Ad-Funding Platform</h1>
    </header>

    <div class="hero">
        <h2>منصتك الذكية لتمويل الحملات الإعلانية</h2>
        <p>نساعد الشركات والمتاجر على توسيع نطاق أعمالهم وزيادة المبيعات عبر توفير ميزانيات إعلانية مرنة ومدعومة.</p>
        <a href="#apply" class="btn">اطلب التمويل الإعلاني الآن</a>
    </div>

    <footer>
        <p>&copy; 2026 Ad-Funding. All rights reserved.</p>
    </footer>

</body>
</html>
